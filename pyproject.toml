[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "iterm-mcp"
version = "2.0.0"
description = "Model Context Protocol server for iTerm2"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE.md" }
authors = [{ name = "Ferris Lucas" }]
dependencies = [
  "mcp>=1.29,<2",
  "iterm2>=2.22,<3",
  "typing-extensions>=4.12,<5",
]

[project.scripts]
iterm-mcp = "iterm_mcp.__main__:run"

[dependency-groups]
dev = [
  "build>=1.2,<2",
  "mypy>=1.15,<2",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
  "ruff>=0.9,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/iterm_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "integration: requires a running iTerm2 instance with Python API enabled",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
